<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El secreto de Santino y la Fábrica de Luces Olvidadas</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>

<body>

    <!-- BARRA SUPERIOR: ESCUCHAR EL CUENTO -->
    <div class="audio-controls">
        <h2>🎧 Escuchá el cuento</h2>

        <div class="audio-buttons">
            <button id="leer-cuento">▶ Escuchar</button>
            <button id="pausar-cuento">⏸ Pausar</button>
            <button id="reanudar-cuento">▶ Continuar</button>
            <button id="detener-cuento">⏹ Detener</button>
        </div>

        <label for="volumen-cuento">
            Volumen de la narración
        </label>

        <input
            type="range"
            id="volumen-cuento"
            min="0"
            max="1"
            step="0.1"
            value="1"
        >

        <p id="estado-audio" aria-live="polite">
            Presioná Escuchar para comenzar.
        </p>
    </div>

    <!-- CUENTO EN FORMATO LIBRO -->
    <main class="book-container">
        <div id="loading">
            Cargando el cuento...
        </div>

        <div id="flip-book" class="flip-book"></div>
    </main>

    <script src="script.js"></script>

</body>
</html>
